services:
  receiver:
    build: .
    command: campwatch-receiver
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./holds:/app/holds:ro
    ports:
      - "8000:8000"   # /status dashboard + /healthz; not required for the watcher
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  watcher:
    build: .
    command: campwatch-watcher
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./holds:/app/holds:ro   # config validation checks hold templates exist
    depends_on:
      receiver:
        condition: service_healthy
